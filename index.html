<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer</title>
    <!-- model-viewerの読み込み -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <model-viewer 
        id="model"
        src="model.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        autoplay 
        animation-name="Armature|All_Night_Dance|baselayer"
        shadow-intensity="1" 
        ar-scale="auto"
        camera-orbit="0deg 75deg 2m"
        alt="3D Character">
        
        <button slot="ar-button" style="padding: 15px; border-radius: 10px; border: none; background: #4285f4; color: white;">
            ARで表示する
        </button>
    </model-viewer>

    <script>
        // デバッグ用：読み込みエラーを表示
        const modelViewer = document.querySelector("#model");
        modelViewer.addEventListener('error', (event) => {
            console.error("モデルの読み込みエラー:", event);
            alert("モデルの読み込みに失敗しました。ファイル名やパスを確認してください。");
        });
    </script>
</body>
</html>
