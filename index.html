<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARテスト</title>
    <!-- 最新のmodel-viewerを読み込み -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; background-color: #e0e0e0; }
        /* ARボタンのスタイルを強制的に目立たせる */
        .ar-button {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 20px 40px; border-radius: 12px; border: none;
            background: #4285F4; color: white; font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="model.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        autoplay
        animation-name="Armature|All_Night_Dance|baselayer"
        shadow-intensity="1"
        alt="3Dモデル">
        
        <!-- カスタムARボタン -->
        <button slot="ar-button" class="ar-button">
            🚀 ARで表示する
        </button>
        
    </model-viewer>

</body>
</html>
